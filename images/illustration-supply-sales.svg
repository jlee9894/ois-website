<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect x="0" y="0" width="400" height="300" fill="#f6f7f9"/>

  <!-- Cardboard box -->
  <g>
    <polygon points="60,150 190,150 190,250 60,250" fill="#d8d2c4"/>
    <polygon points="190,150 224,170 224,250 190,250" fill="#b8b09b"/>
    <polygon points="60,150 94,130 224,130 190,150" fill="#e6e0d2"/>
    <polygon points="60,150 94,130 94,110 60,130" fill="#c2bba9"/>
    <polygon points="94,130 224,130 224,110 94,110" fill="#d8d2c4"/>
    <polygon points="224,130 224,110 190,130" fill="#b8b09b"/>
    <rect x="118" y="150" width="20" height="100" fill="#e8333e"/>
    <rect x="94" y="110" width="20" height="20" fill="#e8333e"/>
    <rect x="180" y="110" width="20" height="20" fill="#e8333e"/>
  </g>

  <!-- Pen cup -->
  <g>
    <line x1="263" y1="176" x2="253" y2="118" stroke="#e3a83b" stroke-width="5" stroke-linecap="round"/>
    <line x1="275" y1="176" x2="279" y2="112" stroke="#e8333e" stroke-width="5" stroke-linecap="round"/>
    <line x1="287" y1="176" x2="299" y2="122" stroke="#9aa1ad" stroke-width="5" stroke-linecap="round"/>
    <rect x="251" y="172" width="48" height="56" rx="6" fill="#1a1a1a"/>
    <ellipse cx="275" cy="172" rx="24" ry="6" fill="#333333"/>
  </g>

  <!-- Sticky notes fan -->
  <g>
    <rect x="290" y="46" width="46" height="46" rx="3" fill="#e3a83b" transform="rotate(-10 313 69)"/>
    <rect x="310" y="40" width="46" height="46" rx="3" fill="#e8333e" transform="rotate(6 333 63)"/>
    <rect x="300" y="62" width="40" height="40" rx="3" fill="#1a1a1a" opacity="0.85" transform="rotate(-2 320 82)"/>
  </g>

  <!-- Paper ream stack -->
  <g>
    <rect x="264" y="206" width="80" height="14" rx="2" fill="#ffffff" stroke="#cbd1db" stroke-width="1.5"/>
    <rect x="260" y="220" width="88" height="14" rx="2" fill="#ffffff" stroke="#cbd1db" stroke-width="1.5"/>
    <rect x="256" y="234" width="96" height="16" rx="2" fill="#ffffff" stroke="#cbd1db" stroke-width="1.5"/>
    <line x1="272" y1="212" x2="324" y2="212" stroke="#cbd1db" stroke-width="2"/>
    <line x1="272" y1="216" x2="310" y2="216" stroke="#cbd1db" stroke-width="2"/>
  </g>
</svg>
