<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8333e"/>
      <stop offset="100%" stop-color="#a81f28"/>
    </linearGradient>
  </defs>

  <!-- Starburst outer ring, echoing the OIS logo -->
  <g fill="#1a1a1a">
    <polygon points="
      120,4  128,44  152,12  148,52  180,28  164,64  198,50  172,80
      210,80  176,100 206,116 168,116 192,140 156,128 168,164 136,144
      136,180 116,148 96,180 96,144 64,164 76,128 40,140 64,116
      30,116 60,100 26,80 60,80 34,50 68,64 52,28 84,52 80,12 104,44
    "/>
  </g>

  <!-- Inner face -->
  <circle cx="120" cy="120" r="86" fill="url(#faceGrad)"/>
  <circle cx="120" cy="120" r="76" fill="none" stroke="#e3a83b" stroke-width="2.5"/>

  <!-- Star -->
  <polygon fill="#e3a83b" points="
    120,66 128.6,86.6 151,88.5 134,103 139.5,125
    120,113 100.5,125 106,103 89,88.5 111.4,86.6
  "/>

  <!-- Text -->
  <text x="120" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#ffffff" letter-spacing="0.5">MINORITY-OWNED</text>
  <text x="120" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="1">BUSINESS</text>
</svg>
